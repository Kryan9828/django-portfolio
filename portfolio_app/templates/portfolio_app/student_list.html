{% extends "portfolio_app/base_template.html" %}

{% block content %}

<h2>Students</h2>

<ul>
    {% for student in students %}
        <li>
            <a href="{% url 'student-detail' student.pk %}">{{ student.name }}</a>
        </li>
    {% empty %}
        <p>No students found.</p>
    {% endfor %}
    <li><a href = "{% url 'student-create' %}">Add Student</a></li>
</ul>

</ul>

<a href = "{% url 'index' %}">Back to Home</a>

{% endblock %}
